server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:mem:retailflow;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server.error.include-message: never
